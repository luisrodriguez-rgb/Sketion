  <text x="30.0" y="46.0" fill="#64748B" font-size="11px" font-weight="400">SKETION TEMPLATE LIBRARY · INGENIERÍA · INTER VECTORIAL</text>
  <rect x="40.0" y="80.0" width="1370.0" height="50.0" rx="6.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="60.0" y="106.0" fill="#0F172A" font-size="11px" font-weight="400">PROBLEMA INICIAL</text>
  <text x="260.0" y="106.0" fill="#334155" font-size="11px" font-weight="400">El servidor de pagos dejo de responder a las 14:00.</text>
  <rect x="40.0" y="140.0" width="1370.0" height="50.0" rx="6.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="60.0" y="166.0" fill="#0F172A" font-size="11px" font-weight="400">1. ¿POR QUE?</text>
  <text x="260.0" y="166.0" fill="#334155" font-size="11px" font-weight="400">La memoria RAM del contenedor se saturo al 100%.</text>
  <rect x="40.0" y="200.0" width="1370.0" height="50.0" rx="6.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="60.0" y="226.0" fill="#0F172A" font-size="11px" font-weight="400">2. ¿POR QUE?</text>
  <text x="260.0" y="226.0" fill="#334155" font-size="11px" font-weight="400">Se acumularon 400.000 peticiones en cola sin liberar.</text>
  <rect x="40.0" y="260.0" width="1370.0" height="50.0" rx="6.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="60.0" y="286.0" fill="#0F172A" font-size="11px" font-weight="400">3. ¿POR QUE?</text>
  <text x="260.0" y="286.0" fill="#334155" font-size="11px" font-weight="400">El driver de base de datos no tenia configurado connection timeout.</text>
  <rect x="40.0" y="320.0" width="1370.0" height="50.0" rx="6.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="60.0" y="346.0" fill="#0F172A" font-size="11px" font-weight="400">4. ¿POR QUE?</text>
  <text x="260.0" y="346.0" fill="#334155" font-size="11px" font-weight="400">Se utilizo la configuracion por defecto en produccion.</text>
  <rect x="40.0" y="380.0" width="1370.0" height="50.0" rx="6.0" fill="#FFF5F2" stroke="#D93829" stroke-width="1.5" />
  <text x="60.0" y="406.0" fill="#D93829" font-size="11px" font-weight="400">5. CAUSA RAIZ</text>
  <text x="260.0" y="406.0" fill="#334155" font-size="11px" font-weight="400">Falta de validacion de perfiles de conexion en el pipeline CI/CD.</text>
