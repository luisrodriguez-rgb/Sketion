<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.0 -30.0 1505.0 525.0" width="1505.0" height="525.0">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arrowhead-hero" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D93829" />
    </marker>
    <marker id="arrowhead-danger" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
    </marker>
  </defs>
  <rect x="-30.0" y="-30.0" width="1505.0" height="525.0" fill="#F8FAFC" />
  <rect x="10.0" y="10.0" width="1425.0" height="445.0" rx="0.0" fill="transparent" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="30.0" y="46.0" fill="#64748B" font-size="11px" font-weight="400">SKETION EXPANSION LIBRARY V2 · ESTUDIO · INTER VECTORIAL</text>
  <rect x="40.0" y="80.0" width="420.0" height="160.0" rx="6.0" fill="#FFF5F2" stroke="#D93829" stroke-width="1.5" />
  <text x="60.0" y="112.0" fill="#D93829" font-size="12px" font-weight="400">LEY DE LITTLE</text>
  <text x="60.0" y="151.0" fill="#475569" font-size="11px" font-weight="400">L = lambda * W
L: Clientes en sistema
lambda: Tasa de llegada
W: Tiempo promedio</text>
  <rect x="480.0" y="80.0" width="440.0" height="160.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="500.0" y="112.0" fill="#0F172A" font-size="12px" font-weight="400">LEY DE AMDAHL</text>
  <text x="500.0" y="151.0" fill="#475569" font-size="11px" font-weight="400">S_latency(s) = 1 / ((1 - p) + p / s)
p: Proporcion paralelizable
s: Factor de aceleracion</text>
  <rect x="940.0" y="80.0" width="460.0" height="160.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="960.0" y="112.0" fill="#0F172A" font-size="12px" font-weight="400">TEOREMA DE BAYES</text>
  <text x="960.0" y="151.0" fill="#475569" font-size="11px" font-weight="400">P(A|B) = [P(B|A) * P(A)] / P(B)
Probabilidad a posteriori dada
nueva evidencia.</text>
  <rect x="40.0" y="260.0" width="660.0" height="160.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="60.0" y="292.0" fill="#0F172A" font-size="12px" font-weight="400">COMPLEJIDAD BIG-O</text>
  <text x="60.0" y="331.0" fill="#475569" font-size="11px" font-weight="400">O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n)
&lt; O(n^2) &lt; O(2^n) &lt; O(n!)</text>
  <rect x="720.0" y="260.0" width="680.0" height="160.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="740.0" y="292.0" fill="#0F172A" font-size="12px" font-weight="400">ENTROPIA DE SHANNON</text>
  <text x="740.0" y="331.0" fill="#475569" font-size="11px" font-weight="400">H(X) = - SUM [ P(x_i) * log_2 P(x_i) ]
Medida de incertidumbre de datos.</text>
</svg>