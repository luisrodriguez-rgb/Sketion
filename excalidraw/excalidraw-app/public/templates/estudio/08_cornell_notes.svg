<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.0 -30.0 1505.0 545.0" width="1505.0" height="545.0">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap");
      text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arrowhead-hero" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D93829" />
    </marker>
    <marker id="arrowhead-danger" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
    </marker>
  </defs>
  <rect x="-30.0" y="-30.0" width="1505.0" height="545.0" fill="#F8FAFC" />
  <rect x="10.0" y="10.0" width="1425.0" height="465.0" rx="0.0" fill="transparent" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="30.0" y="46.0" fill="#64748B" font-size="11px" font-weight="400">SKETION TEMPLATE LIBRARY · ESTUDIO · INTER VECTORIAL</text>
  <rect x="40.0" y="70.0" width="360.0" height="260.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="60.0" y="101.0" fill="#D93829" font-size="11px" font-weight="400">CUE COLUMN (INDICIOS / PREGUNTAS)</text>
  <text x="60.0" y="141.0" fill="#334155" font-size="11px" font-weight="400">¿Por que desacoplar la persistencia?
¿Cual es el coste de consistencia?
¿Cuando usar event sourcing?</text>
  <rect x="420.0" y="70.0" width="980.0" height="260.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="440.0" y="101.0" fill="#0F172A" font-size="11px" font-weight="400">NOTE-TAKING COLUMN (NOTAS DE CLASE)</text>
  <text x="440.0" y="141.0" fill="#475569" font-size="11px" font-weight="400">El desacoplamiento permite cambiar el motor de persistencia sin tocar la logica de negocio.
La consistencia eventual permite escalar horizontalmente manteniendo alta disponibilidad.
Event Sourcing almacena cada mutacion de estado como un hecho inmutable append-only.</text>
  <rect x="40.0" y="345.0" width="1360.0" height="95.0" rx="6.0" fill="#FFF5F2" stroke="#D93829" stroke-width="1.5" />
  <text x="60.0" y="371.0" fill="#D93829" font-size="11px" font-weight="400">SUMMARY (SINTESIS AL FINALIZAR)</text>
  <text x="60.0" y="401.0" fill="#334155" font-size="11px" font-weight="400">La arquitectura modular protege el dominio del sistema y permite escalabilidad controlada.</text>
</svg>