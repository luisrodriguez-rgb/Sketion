  <rect x="380.0" y="80.0" width="340.0" height="350.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="400.0" y="117.0" fill="#0F172A" font-size="12px" font-weight="400">MAPA DE PERSONAJES</text>
  <text x="400.0" y="156.0" fill="#475569" font-size="11px" font-weight="400">* Protagonista: El Principito
* Mentor: El Zorro (domesticacion)
