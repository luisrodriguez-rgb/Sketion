4. Desenlace: Despedida en el desierto</text>
  <rect x="1100.0" y="80.0" width="310.0" height="350.0" rx="6.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="1120.0" y="117.0" fill="#0F172A" font-size="12px" font-weight="400">TEMAS &amp; CITAS CRITICAS</text>
  <text x="1120.0" y="156.0" fill="#475569" font-size="11px" font-weight="400">&#x27;Eres responsable para siempre de lo que has domesticado.&#x27;

