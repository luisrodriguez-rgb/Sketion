  <text x="50.0" y="103.0" fill="#64748B" font-size="9px" font-weight="400">&lt;&lt;entity&gt;&gt;</text>
  <text x="50.0" y="120.0" fill="#0F172A" font-size="12px" font-weight="400">UserAccount</text>
  <text x="52.0" y="146.0" fill="#334155" font-size="10px" font-weight="400">+ id: UUID</text>
  <text x="52.0" y="164.0" fill="#334155" font-size="10px" font-weight="400">+ email: String</text>
  <text x="52.0" y="182.0" fill="#334155" font-size="10px" font-weight="400">+ hashedPassword: str</text>
  <text x="52.0" y="200.0" fill="#334155" font-size="10px" font-weight="400">+ isActive: bool</text>
  <line x1="40.0" y1="212.0" x2="360.0" y2="212.0" stroke="#CBD5E1" stroke-width="1.0" />
