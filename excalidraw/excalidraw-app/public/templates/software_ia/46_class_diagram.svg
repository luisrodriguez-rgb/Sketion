  <text x="950.0" y="120.0" fill="#0F172A" font-size="12px" font-weight="400">PaymentTransaction</text>
  <text x="952.0" y="146.0" fill="#334155" font-size="10px" font-weight="400">+ txId: UUID</text>
  <text x="952.0" y="164.0" fill="#334155" font-size="10px" font-weight="400">+ gatewayRef: str</text>
  <text x="952.0" y="182.0" fill="#334155" font-size="10px" font-weight="400">+ amount: Decimal</text>
  <text x="952.0" y="200.0" fill="#334155" font-size="10px" font-weight="400">+ processedAt: DateTime</text>
  <line x1="940.0" y1="212.0" x2="1280.0" y2="212.0" stroke="#CBD5E1" stroke-width="1.0" />
  <text x="952.0" y="230.0" fill="#0F172A" font-size="10px" font-weight="400">+ authorize()()</text>
  <text x="952.0" y="248.0" fill="#0F172A" font-size="10px" font-weight="400">+ capture()()</text>
  <text x="952.0" y="266.0" fill="#0F172A" font-size="10px" font-weight="400">+ refund(reason)()</text>
