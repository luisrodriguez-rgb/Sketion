  <text x="52.0" y="248.0" fill="#0F172A" font-size="10px" font-weight="400">+ changeEmail(newEmail)()</text>
  <text x="52.0" y="266.0" fill="#0F172A" font-size="10px" font-weight="400">+ deactivate()()</text>
  <line x1="360.0" y1="210.0" x2="480.0" y2="210.0" stroke="#0F172A" stroke-width="1.5" marker-end="url(#arrowhead)" />
