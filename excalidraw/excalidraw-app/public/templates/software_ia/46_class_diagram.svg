  <text x="492.0" y="164.0" fill="#334155" font-size="10px" font-weight="400">+ totalAmount: Decimal</text>
  <text x="492.0" y="182.0" fill="#334155" font-size="10px" font-weight="400">+ status: OrderStatus</text>
