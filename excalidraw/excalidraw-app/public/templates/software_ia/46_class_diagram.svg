  <text x="492.0" y="248.0" fill="#0F172A" font-size="10px" font-weight="400">+ calculateTotal()()</text>
  <text x="492.0" y="266.0" fill="#0F172A" font-size="10px" font-weight="400">+ markAsPaid()()</text>
